services:
  - type: web
    name: tg-proxy
    runtime: docker
    plan: free
    region: frankfurt   # oregon | ohio | virginia | frankfurt | singapore
    healthCheckPath: /
    envVars:
      - key: SECRET
        generateValue: true   # stable random secret -> fixed link across restarts
      - key: TELEGRAM_ONLY
        value: "0"            # set to 1 to only allow Telegram IP ranges (saves bandwidth)
      - key: QUOTA_GB
        value: "100"
